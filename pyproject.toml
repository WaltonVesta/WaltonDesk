[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# ============================================================================
# PEP 621 项目元数据
# ============================================================================
[project]
name = "rdc"
version = "5.0.0"
description = "远程桌面控制 — 跨平台主控端/被控端，asyncio + PySide6 + H.264"
readme = "README.md"
# numpy>=2.5 要求 Python >=3.12（其存根用 PEP 695 type 语句），故下限锁 3.12。
# 见 PROGRESS.md 发现 1 与用户 2026-09-20 确认的方案 A。
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RemoteDesktop Control Team" }]
keywords = ["remote-desktop", "remote-control", "pyside6", "asyncio", "h264"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

# ----------------------------------------------------------------------------
# 运行时依赖
# 许可证均已核查，无 GPL（约束 9）：
#   PySide6=LGPLv3  cryptography=Apache-2.0/BSD  bcrypt=Apache-2.0
#   Pillow=HPND     mss=BSD-3        numpy=BSD-3
#   av=BSD-3        opencv-headless=Apache-2.0   pynput=LGPLv3
#   pyperclip=BSD-3 pyautogui=BSD-3  structlog=Apache-2.0/MIT
#   pydantic=MIT    protobuf=BSD-3   psutil=BSD-3
# 注：LGPL 在约束 9 允许范围内（MIT/Apache/BSD/LGPL）。
# ----------------------------------------------------------------------------
dependencies = [
    "PySide6>=6.8",
    "cryptography>=44.0",
    "bcrypt>=4.2",
    "Pillow>=11.0",
    "mss>=9.0",
    "numpy>=2.0",
    "av>=13.0",
    "opencv-python-headless>=4.10",
    "pynput>=1.7",
    "pyperclip>=1.9",
    "pyautogui>=0.9.54",
    "structlog>=24.4",
    "pydantic>=2.9",
    "protobuf>=5.28",
    "psutil>=6.0",
    "qasync>=0.28",
]

[project.optional-dependencies]
# WebSocket 备选传输后端（阶段 4）
websocket = ["aiohttp>=3.10"]
# 音频传输（阶段 8，可选功能）
audio = ["sounddevice>=0.5"]
# Linux 密钥环（阶段 2）—— 平台标记避免在其他平台解析失败
linux-secrets = ["secretstorage>=3.3; sys_platform == 'linux'"]
# macOS 密钥环（阶段 2）—— 平台标记；本机无法验证，CI 中处理
macos-secrets = ["pyobjc-framework-Security>=10.0; sys_platform == 'darwin'"]

[project.scripts]
rdc = "rdc.cli:main"

[project.urls]
Homepage = "https://example.invalid/rdc"
Changelog = "https://example.invalid/rdc/blob/master/CHANGELOG.md"

# ============================================================================
# PEP 735 依赖组（开发/测试/打包），不进入发布产物
# ============================================================================
[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-psutil>=6.0",
]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "pytest-xvfb>=3.0; sys_platform == 'linux'",
]
security = [
    "bandit>=1.8",
    "pip-audit>=2.7",
]
package = [
    # 本机使用（无 C 编译器，见 REFACTOR_PLAN §5 Q1）
    "pyinstaller>=6.10",
    # 仅 CI 使用：Nuitka 需 C 编译器，本机无法运行
    "nuitka>=2.4",
]
proto = [
    # Protobuf 代码生成（阶段 3）
    "grpcio-tools>=1.66",
]

# ============================================================================
# uv 行为配置
# ============================================================================
[tool.uv]
# PEP 735：dev/test 为日常开发默认组，裸 `uv sync` 即安装。
# security/package/proto 组按需显式启用：
#   uv sync --group security   # 阶段 9
#   uv sync --group package    # 阶段 10
#   uv sync --group proto      # 阶段 3（生成 Protobuf 代码）
#   uv sync --all-groups       # 全部
default-groups = ["dev", "test"]

# ============================================================================
# 构建：src layout
# ============================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/rdc"]

[tool.hatch.build.targets.sdist]
include = ["src/rdc", "tests", "scripts", "proto", "README.md", "CHANGELOG.md"]

# ============================================================================
# ruff —— 约束：line-length=100，启用 E/F/I/N/UP/B/SIM
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# pb/ 是 protoc 生成物（legacy_v4/ 已于阶段 6 删除）
extend-exclude = [
    "src/rdc/protocol/pb",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    # E501 行长由 formatter 处理，避免与中文字符宽度计算冲突
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# 测试中允许未类型化的 fixture 参数与断言写法
"tests/**" = ["N802", "B011"]
# 平台特化模块必然出现"导入但未使用"（按 sys.platform 动态选用）
"src/rdc/secrets/**" = ["F401"]
"src/rdc/input/**" = ["F401"]
"src/rdc/host/**" = ["F401"]
"src/rdc/__init__.py" = ["F401"]
# N801/N806：DCX_WINDOW、PROCESS_QUERY_LIMITED_INFORMATION 等是 Win32 API
# 原名，改成小写反而与系统 API 不符、降低可读性。仅对含平台原生调用的模块
# 豁免命名规则。
# ✅(phase-9): 原 "src/rdc/config/_v4_config.py" N801 豁免随该文件删除移除
"src/rdc/input/dpi.py" = ["N806"]            # DCX_WINDOW 等 Win32 常量
"src/rdc/server/pid_manager.py" = ["N806"]   # PROCESS_QUERY_LIMITED_INFORMATION
# ✅(phase-9): 原 rdc/server/service.py（v4 线程模型）已随批 3 拆除删除，本豁免移除
# N812：协议层 `constants as C` / `messages as M` 单字母别名是 wire 代码惯例，
# 缩短逐包构造/解析路径中高频字段前缀，提升往返代码可读性。
"src/rdc/protocol/**" = ["N812"]
"tests/unit/test_protocol_*.py" = ["N812"]
# N815：Qt Signal 成员按 Qt 惯例必须 camelCase（与 Qt 文档/示例一致；
# 改 snake_case 反而破坏生态一致性，且信号连接按名反射查找）。
"src/rdc/ui/**" = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["rdc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ============================================================================
# mypy —— strict 模式（约束 7）
# ============================================================================
[tool.mypy]
# 注意：核心依赖 numpy>=2.5 要求 Python >=3.12，且其存根使用 PEP 695 `type` 语句
# （3.12+ 语法）。设为 3.11 会导致 mypy 在 numpy 存根上报语法错并中止检查。
# 实测于阶段 1：numpy 2.5.3 requires-python=>=3.12。
python_version = "3.12"
mypy_path = "src"
packages = ["rdc"]
explicit_package_bases = true
strict = true
# warn_unreachable 不属于 mypy strict（约束 7 要求的是 strict），是额外项。
# 实测它对两类合法代码产生结构性误报，且无法通过局部改写消除：
#   1. 跨线程取消守卫：`while not self._stop:` 循环内的 `if self._stop: break`，
#      _stop 由另一线程的 stop() 置位，mypy 无法建模跨线程状态变更
#      （transport/reconnect.py:93、transport/screen_channel.py:188）。
#   2. 跨平台分支：win32 上检查时，非 win32 的 sys.platform 分支被判不可达
#      （config/_v4_config.py:209 的 darwin 分支）。
# 关闭它不降低 strict 严格度；真实的死代码由 code review 与测试覆盖兜底。
warn_unreachable = false
warn_no_return = true
show_error_codes = true
pretty = true
# 禁止裸 ignore：必须带错误码（REFACTOR_PLAN 风险 R3 缓解措施）
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-bool"]
exclude = [
    "^src/rdc/protocol/pb/",
    "^build/",
    "^dist/",
]

# --- 缺失类型存根的第三方库 ---------------------------------------------------
# 说明：这些库未提供 py.typed 或未发布 stubs。ignore_missing_imports 只关闭
# "找不到存根"这一类报错，不影响本项目代码的类型检查严格度。
[[tool.mypy.overrides]]
module = [
    "mss.*",
    "pynput.*",
    "pyperclip.*",
    "pyautogui.*",
    "av.*",
    "cv2.*",
    "secretstorage.*",
    "sounddevice.*",
    "Security.*",
    "AppKit.*",
    "Quartz.*",
    "grpc_tools.*",
    "grpc.*",
    "google.protobuf.*",
    "PIL.*",
    "pystray.*",
    "qasync",  # 0.28.0 无 py.typed / stubs（site-packages 实测）
    # macOS 专有：input/dpi.py 中按平台条件导入，Windows/Linux 上不存在
    "objc",
    "objc.*",
]
ignore_missing_imports = true

# --- v4 机械搬迁代码的临时宽松配置 -------------------------------------------
# REFACTOR_PLAN 风险 R3：mypy strict 对 7,505 行 v4 代码实测报 **433 错**，
# 其中 337 个纯属"缺类型注解"（no-untyped-def 134 / type-arg 89 /
# no-untyped-call 76 / no-any-return 38），会在各阶段重写对应模块时自然补齐。
# 在机械搬迁阶段硬凑注解会大幅膨胀 diff 且掩盖真实类型 bug。
#
# 降级策略（四项"缺注解"开关）：
#   disallow_untyped_defs    → 关（no-untyped-def）
#   disallow_incomplete_defs → 关
#   disallow_untyped_calls   → 关（no-untyped-call）
#   disallow_any_generics    → 关（type-arg）
#   warn_return_any          → 关（no-any-return）
#   check_untyped_defs       → **保持开启**，继续抓真实类型 bug
#
# ⚠️ 只关闭"缺注解"类检查。assignment / union-attr / attr-defined / list-item /
#    unreachable 等**真实类型错误不在豁免范围**，阶段 1 内必须修完。
# ⚠️ 裸 `# type: ignore` 已被 enable_error_code=["ignore-without-code"] 阻止。
# ⚠️ 本清单**只收 v4 搬迁模块**。各阶段新写的模块一律走全局 strict，
#    禁止加入本清单；重写完成后须从此处移除对应条目（见 TODO 标注）。
#
# 消解时间表：
#   TODO(phase-2):  移除 rdc.config._v4_config（Pydantic Settings 重写）
#                   移除 rdc.logger（structlog 改造）
#   ✅(phase-3):    已移除 rdc.protocol.framing（v5 重写补注解）、
#                   rdc.constants（协议常量拆到 protocol/constants 并全注解）、
#                   rdc.exceptions（全部类已注解；根级残留见下行说明）
#   TODO(phase-4):  移除 rdc.transport.*（asyncio 重写）
#   ✅(phase-4):    已移除 rdc.transport.control_channel、
#                   rdc.transport.screen_channel、rdc.transport.heartbeat、
#                   rdc.transport.reconnect（asyncio 重写补全注解）
#   TODO(phase-3/4):移除 rdc.server.service、rdc.server.pid_manager（拆分）
#   ✅(phase-5):    已移除 rdc.capture.diff、rdc.capture.mss_source、
#                   rdc.encoding.jpeg（向量化差分 + mss 源 + H.264/协议化 JPEG 重写补注解）
#   ✅(phase-6):    已移除 rdc.capture.framerate（v5 重写为纯决策器，capture 宽松条目清零）
#   TODO(phase-7):  移除 rdc.input.*（InputBackend 抽象）
#                   移除 rdc.host.*（PlatformAdapter 抽象）
#   TODO(phase-9):  移除 rdc.security.fingerprint（安全加固）
#                   ✅(phase-9): 已移除——fingerprint 加固重写（异常收窄+
#                   原子写+全量注解），清单条目同步删除
#   TODO(phase-1):  rdc.client.ratelimit 为纯算法模块，阶段 1 补注解后即可移除
[[tool.mypy.overrides]]
module = [
    # ✅(phase-9): 移除 rdc.constants（根级双份常量已删，唯一消费方迁本地常量）
    # ✅(phase-9): 移除 rdc.config._v4_config（v4 配置层已删，v5 一律 Settings）
    # ✅(phase-4): 移除 rdc.transport.{control_channel,screen_channel,heartbeat,reconnect}
    #   （asyncio 重写完成，全部走全局 strict；新 transport 模块一律不加入本清单）
    # server（阶段 3-9 拆分为 auth/broadcaster/banlist）
    # ✅(phase-9): 原 rdc.server.service（v4 线程模型）已删除，豁免同步移除
    # ✅(phase-9): 移除 rdc.server.pid_manager（批 3 接入：路径收敛 paths +
    #   补类型注解后全局 strict 实测 0 error，兑现 TODO(phase-3/4)）
    # ✅(phase-5): 移除 rdc.capture.{diff,mss_source}、rdc.encoding.jpeg
    # ✅(phase-6): 移除 rdc.capture.framerate（v5 重写补全注解）
    # client
    # ✅(phase-9): 移除 rdc.client.ratelimit（批 4 补全注解，全局 strict 0 error，
    #   兑现 TODO(phase-1)）
    # ✅(phase-7): 移除 rdc.input.{mouse,keyboard,dpi,modifiers}
    #   （v4 四件已删除：mouse/keyboard 语义并入 InputBackend 实现 +
    #    legacy_pyautogui 回退；DPIAdapter/ModifierState 无 v5 消费方，
    #    多显示器坐标由 ScreenRect/GetSystemMetrics 承担，修饰键记账由
    #    后端 _pressed_keys/_pressed_buttons 承担。git 历史可查原实现。）
    # host（阶段 7/10 PlatformAdapter 抽象）
    # ✅(phase-9 走查第十二批 Feature 17): 移除 rdc.host.autostart
    #   （重写补全类型注解 + 平台分发集中在方法内，全局 strict 实测 0 error；
    #    power/netinfo 仍留宽松——本轮未触碰，不得虚报兑现）
    "rdc.host.power",
    "rdc.host.netinfo",
    # security（阶段 9 加固）
    # ✅(phase-9): 移除 rdc.security.fingerprint（加固重写：异常收窄、
    #   原子写、structlog、全量注解，全局 strict 实测 0 error）
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
check_untyped_defs = true

# ============================================================================
# pytest
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: 单元测试（无外部依赖，必须全绿）",
    "integration: 集成测试（双进程/真实 socket）",
    "e2e: 端到端测试（pytest-qt，需显示环境）",
    "load: 性能/压力测试（耗时长，默认跳过）",
    "compat: v4↔v5 兼容性测试",
    "security: 安全测试",
    "slow: 耗时测试，默认不跑",
    "gui: 需要真实 GUI/显示环境的测试",
]
filterwarnings = [
    "error",
    # 第三方库在 Python 3.14 下的弃用警告不应导致本项目测试失败
    "ignore::DeprecationWarning:PySide6.*",
    "ignore::DeprecationWarning:google.protobuf.*",
    # qasync 0.28.0 内部用 asyncio.iscoroutinefunction（3.14 弃用、3.16 移除）。
    # 告警经 stacklevel 归属到调用方模块，故按消息匹配。
    # ⚠️ qasync 官方 README 声明支持 <3.14；本机 3.14.3 实测四项判据全过
    # （scripts/poc）。3.16 时须切换 PoC 保留的方案乙（loop-in-thread+Signal）。
    "ignore:.*iscoroutinefunction.*",
]

# ============================================================================
# coverage —— 目标：总体 ≥70%，核心模块 ≥85%（约束 8）
# ============================================================================
[tool.coverage.run]
source = ["src/rdc"]
branch = true
parallel = true
omit = [
    "src/rdc/protocol/pb/*",  # protoc 生成物
    "src/rdc/__main__.py",
    # ✅(phase-9): 原 omit "src/rdc/config/_v4_config.py" 随该文件删除移除
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
# 阶段 1 只建骨架，全局阈值在各阶段逐步提升；最终 v5.0.0 必须 ≥70
fail_under = 0

[tool.coverage.html]
directory = "htmlcov"

# 核心模块（协议/认证/传输/编码）≥85% —— 用 --cov-report 逐项核对，
# 阶段 3-5 各自验收时检查，此处列出清单供 PROGRESS.md 追踪：
#   rdc/protocol/*   rdc/transport/*   rdc/encoding/*
#   rdc/server/auth  rdc/server/banlist   rdc/secrets/*   rdc/config/migration

[tool.coverage.paths]
source = ["src/rdc"]

# ============================================================================
# bandit —— 阶段 9 验收 0 high
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests", "src/rdc/protocol/pb", "build", "dist"]
# ✅(phase-3): 原 B324 跳过（framing MD5）已随 v5 重写移除 ——
# create_screen 校验字段改用 SHA-256（usedforsecurity=False），src/ 内无 MD5 残留。
skips = []
